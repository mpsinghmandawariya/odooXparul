{% extends "base_premium.html" %}

{% block title %}Edit Trip - Traveloop{% endblock %}

{% block content %}

<section class="section">
    <div class="glass-card" style="max-width: 800px; margin: 0 auto; padding: 3rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 80px; height: 80px; margin: 0 auto 1rem; background: var(--accent-gradient); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">
                <i class="fas fa-edit"></i>
            </div>
            <h2 style="font-size: 2rem; margin-bottom: 0.5rem;">Edit Trip Details</h2>
            <p style="color: var(--text-secondary);">Update your trip information</p>
        </div>

        <form method="POST" action="{{ url_for('trips.edit_trip', trip_id=trip.id) }}">
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Trip Name <span style="color: var(--danger);">*</span></label>
                <div style="position: relative;">
                    <i class="fas fa-suitcase" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="text" name="trip_name" value="{{ trip.trip_name }}" required
                           style="width: 100%; padding: 0.875rem 1rem 0.875rem 3rem; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-primary); font-size: 1rem;" />
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Start Date</label>
                    <div style="position: relative;">
                        <i class="fas fa-calendar-alt" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                        <input type="date" name="start_date" value="{{ trip.start_date }}"
                               style="width: 100%; padding: 0.875rem 1rem 0.875rem 3rem; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-primary); font-size: 1rem;" />
                    </div>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">End Date</label>
                    <div style="position: relative;">
                        <i class="fas fa-calendar-check" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                        <input type="date" name="end_date" value="{{ trip.end_date }}"
                               style="width: 100%; padding: 0.875rem 1rem 0.875rem 3rem; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-primary); font-size: 1rem;" />
                    </div>
                </div>
            </div>
            
            <div style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Destination Country</label>
                <div style="position: relative;">
                    <i class="fas fa-globe" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                    <input type="text" name="destination_country" value="{{ trip.destination_country or '' }}" placeholder="e.g. France"
                           style="width: 100%; padding: 0.875rem 1rem 0.875rem 3rem; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-primary); font-size: 1rem;" />
                </div>
            </div>
            
            <div style="margin-bottom: 2rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Description</label>
                <textarea name="description" rows="4" placeholder="What's this trip about?"
                          style="width: 100%; padding: 0.875rem 1rem; background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-primary); font-size: 1rem; resize: vertical;">{{ trip.description or '' }}</textarea>
            </div>
            
            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <a href="{{ url_for('trips.my_trips') }}" class="btn btn-ghost">
                    <i class="fas fa-times"></i>
                    Cancel
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i>
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</section>

{% endblock %}
