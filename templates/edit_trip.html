{% extends "base.html" %}
{% block title %}Edit Trip — Traveloop{% endblock %}
{% block body %}
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><i class="fa fa-paper-plane"></i><span>Traveloop</span></div>
    <nav class="sidebar-nav">
      <a href="{{ url_for('dashboard') }}" class="nav-item"><i class="fa fa-home"></i><span>Dashboard</span></a>
      <a href="{{ url_for('my_trips') }}" class="nav-item active"><i class="fa fa-suitcase"></i><span>My Trips</span></a>
      <a href="{{ url_for('search_city') }}" class="nav-item"><i class="fa fa-search-location"></i><span>Search Cities</span></a>
      <a href="{{ url_for('search_activity') }}" class="nav-item"><i class="fa fa-hiking"></i><span>Activities</span></a>
      <a href="{{ url_for('analytics') }}" class="nav-item"><i class="fa fa-chart-line"></i><span>Analytics</span></a>
      <a href="{{ url_for('profile') }}" class="nav-item"><i class="fa fa-user-circle"></i><span>Profile</span></a>
      <a href="{{ url_for('logout') }}" class="nav-item nav-logout"><i class="fa fa-sign-out-alt"></i><span>Logout</span></a>
    </nav>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fa fa-bars"></i></button>
      <h2 class="topbar-title">Edit Trip</h2>
    </header>

    <div class="form-page">
      <div class="form-card">
        <div class="form-card-header">
          <div class="form-card-icon"><i class="fa fa-edit"></i></div>
          <div>
            <h2>Edit Trip Details</h2>
            <p>Update your trip information</p>
          </div>
        </div>

        <form method="POST">
          <div class="form-group">
            <label>Trip Name <span class="required">*</span></label>
            <input type="text" name="trip_name" value="{{ trip.trip_name }}" required/>
          </div>
          <div class="form-grid-2">
            <div class="form-group">
              <label>Start Date</label>
              <input type="date" name="start_date" value="{{ trip.start_date }}"/>
            </div>
            <div class="form-group">
              <label>End Date</label>
              <input type="date" name="end_date" value="{{ trip.end_date }}"/>
            </div>
          </div>
          <div class="form-group">
            <label>Destination Country</label>
            <input type="text" name="destination_country" value="{{ trip.destination_country or '' }}" placeholder="e.g. France"/>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4">{{ trip.description or '' }}</textarea>
          </div>
          <div class="form-actions">
            <a href="{{ url_for('my_trips') }}" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
{% endblock %}
