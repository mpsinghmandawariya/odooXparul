{% extends "base.html" %}
{% block title %}Reset Password — Traveloop{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <i class="fa fa-paper-plane"></i>
      <span>Traveloop</span>
    </div>

    {% if step == 1 %}
    <h2 class="auth-title">Forgot Password</h2>
    <p class="auth-sub">Enter your registered email to continue</p>
    <form method="POST">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-icon">
          <i class="fa fa-envelope"></i>
          <input type="email" name="email" placeholder="you@example.com" required/>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Verify Email</button>
    </form>

    {% else %}
    <h2 class="auth-title">Set New Password</h2>
    <p class="auth-sub">Choose a strong new password</p>
    <form method="POST">
      <div class="form-group">
        <label>New Password</label>
        <div class="input-icon">
          <i class="fa fa-lock"></i>
          <input type="password" name="password" id="newPw" placeholder="••••••••" required/>
          <button type="button" class="toggle-pw" onclick="togglePassword('newPw', this)"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <div class="input-icon">
          <i class="fa fa-lock"></i>
          <input type="password" name="confirm_password" id="confirmNewPw" placeholder="••••••••" required/>
          <button type="button" class="toggle-pw" onclick="togglePassword('confirmNewPw', this)"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Reset Password</button>
    </form>
    {% endif %}

    <p class="auth-footer"><a href="{{ url_for('login') }}"><i class="fa fa-arrow-left"></i> Back to Login</a></p>
  </div>
</div>
{% endblock %}
