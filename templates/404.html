<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .error-container {
            max-width: 600px;
            text-align: center;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-icon {
            position: relative;
            margin-bottom: 2rem;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-icon i {
            font-size: 6rem;
            color: #3b82f6;
            opacity: 0.3;
        }
        .error-code {
            position: absolute;
            font-size: 4rem;
            font-weight: 700;
            color: #f8fafc;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }
        .error-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .error-message {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .btn {
            padding: 0.875rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
        }
        .btn-secondary {
            background: rgba(59, 130, 246, 0.1);
            color: #3B82F6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.2);
            transform: translateY(-2px);
        }
        .error-suggestions {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .error-suggestions p {
            color: #94a3b8;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .error-suggestions ul {
            list-style: none;
            padding: 0;
        }
        .error-suggestions li {
            margin: 0.5rem 0;
        }
        .error-suggestions a {
            color: #3b82f6;
            text-decoration: none;
            transition: color 0.3s;
        }
        .error-suggestions a:hover {
            color: #60a5fa;
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            .error-container { padding: 2rem; }
            .error-icon i { font-size: 4rem; }
            .error-code { font-size: 3rem; }
            .error-title { font-size: 1.5rem; }
            .error-actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-map-marked-alt"></i>
            <span class="error-code">404</span>
        </div>
        <h1 class="error-title">Oops! You're Lost</h1>
        <p class="error-message">The page you're looking for doesn't exist. It might have been moved or deleted.</p>
        <div class="error-actions">
            <a href="/dashboard" class="btn btn-primary">
                <i class="fas fa-home"></i>
                Go to Dashboard
            </a>
            <a href="/my-trips" class="btn btn-secondary">
                <i class="fas fa-suitcase"></i>
                View My Trips
            </a>
        </div>
        <div class="error-suggestions">
            <p>You might want to:</p>
            <ul>
                <li><a href="/create-trip">Create a new trip</a></li>
                <li><a href="/search-city">Search for destinations</a></li>
                <li><a href="/community">Explore community posts</a></li>
                <li><a href="/login">Go to Login</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
