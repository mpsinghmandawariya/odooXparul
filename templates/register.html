{% extends "base_premium.html" %}
{% block title %}Register — Traveloop{% endblock %}
{% block body %}
<div class="auth-page auth-page-wide">
  <div class="auth-card auth-card-wide">
    <div class="auth-logo">
      <i class="fa fa-paper-plane"></i>
      <span>Traveloop</span>
    </div>
    <h2 class="auth-title">Create your account</h2>
    <p class="auth-sub">Start planning your adventures today</p>

    <form method="POST" action="{{ url_for('auth.register') }}" novalidate id="registerForm">
      <div class="form-grid-2">
        <div class="form-group">
          <label>First Name</label>
          <div class="input-icon">
            <i class="fa fa-user"></i>
            <input type="text" name="first_name" placeholder="John" required/>
          </div>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <div class="input-icon">
            <i class="fa fa-user"></i>
            <input type="text" name="last_name" placeholder="Doe" required/>
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-icon">
            <i class="fa fa-envelope"></i>
            <input type="email" name="email" placeholder="you@example.com" required/>
          </div>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <div class="input-icon">
            <i class="fa fa-phone"></i>
            <input type="tel" name="phone" placeholder="+1 234 567 8900"/>
          </div>
        </div>
        <div class="form-group">
          <label>City</label>
          <div class="input-icon">
            <i class="fa fa-city"></i>
            <input type="text" name="city" placeholder="New York"/>
          </div>
        </div>
        <div class="form-group">
          <label>Country</label>
          <div class="input-icon">
            <i class="fa fa-globe"></i>
            <input type="text" name="country" placeholder="United States"/>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-icon">
            <i class="fa fa-lock"></i>
            <input type="password" name="password" id="regPassword" placeholder="••••••••" required oninput="checkStrength(this.value)"/>
            <button type="button" class="toggle-pw" onclick="togglePassword('regPassword', this)"><i class="fa fa-eye"></i></button>
          </div>
          <div class="strength-bar"><div id="strengthFill"></div></div>
          <span id="strengthLabel" class="strength-label"></span>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-icon">
            <i class="fa fa-lock"></i>
            <input type="password" name="confirm_password" id="confirmPassword" placeholder="••••••••" required/>
            <button type="button" class="toggle-pw" onclick="togglePassword('confirmPassword', this)"><i class="fa fa-eye"></i></button>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>Additional Information <span class="optional">(optional)</span></label>
        <textarea name="additional_info" rows="3" placeholder="Tell us about your travel preferences..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Create Account</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
  </div>
</div>
{% endblock %}
