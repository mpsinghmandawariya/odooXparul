<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Traveloop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/premium.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
        }
        
        .auth-container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-secondary);
            border-radius: var(--radius-2xl);
            padding: 3rem;
            box-shadow: var(--shadow-xl);
        }
        
        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .auth-logo i {
            font-size: 3rem;
            color: var(--accent-blue);
            margin-bottom: 1rem;
        }
        
        .auth-logo h1 {
            font-size: 2rem;
            margin: 0;
        }
        
        .auth-title {
            text-align: center;
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        
        .auth-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .input-group {
            position: relative;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .input-group i {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        
        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 1rem 1rem 1rem 3.5rem;
            background: var(--bg-primary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all var(--transition-base);
            font-family: 'Inter', sans-serif;
        }
        
        .input-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .input-group input:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem;
        }
        
        .strength-bar {
            height: 4px;
            background: var(--bg-primary);
            border-radius: var(--radius-full);
            margin-top: 0.5rem;
            overflow: hidden;
        }
        
        .strength-fill {
            height: 100%;
            width: 0;
            transition: all var(--transition-base);
            border-radius: var(--radius-full);
        }
        
        .strength-label {
            display: block;
            margin-top: 0.25rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            color: var(--text-secondary);
        }
        
        .auth-footer a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">
            <i class="fas fa-plane-departure"></i>
            <h1 class="text-gradient">Traveloop</h1>
        </div>
        
        <h2 class="auth-title">Create your account</h2>
        <p class="auth-subtitle">Start planning your adventures today</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div style="padding: 1rem; margin-bottom: 1.5rem; border-radius: var(--radius-lg); background: {% if category == 'success' %}#d4edda{% elif category == 'error' %}#f8d7da{% else %}#d1ecf1{% endif %}; color: {% if category == 'success' %}#155724{% elif category == 'error' %}#721c24{% else %}#0c5460{% endif %}; border: 1px solid {% if category == 'success' %}#c3e6cb{% elif category == 'error' %}#f5c6cb{% else %}#bee5eb{% endif %};">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-grid">
                <div class="input-group">
                    <label>First Name</label>
                    <i class="fas fa-user"></i>
                    <input type="text" name="first_name" placeholder="John" required/>
                </div>
                
                <div class="input-group">
                    <label>Last Name</label>
                    <i class="fas fa-user"></i>
                    <input type="text" name="last_name" placeholder="Doe" required/>
                </div>
                
                <div class="input-group">
                    <label>Email Address</label>
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="you@example.com" required/>
                </div>
                
                <div class="input-group">
                    <label>Phone Number</label>
                    <i class="fas fa-phone"></i>
                    <input type="tel" name="phone" placeholder="+1 234 567 8900"/>
                </div>
                
                <div class="input-group">
                    <label>City</label>
                    <i class="fas fa-city"></i>
                    <input type="text" name="city" placeholder="New York"/>
                </div>
                
                <div class="input-group">
                    <label>Country</label>
                    <i class="fas fa-globe"></i>
                    <input type="text" name="country" placeholder="United States"/>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" id="password" placeholder="••••••••" required oninput="checkStrength(this.value)"/>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <span class="strength-label" id="strengthLabel"></span>
                </div>
                
                <div class="input-group">
                    <label>Confirm Password</label>
                    <i class="fas fa-lock"></i>
                    <input type="password" name="confirm_password" id="confirmPassword" placeholder="••••••••" required/>
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <div class="input-group" style="margin-bottom: 2rem;">
                <label>Additional Information <span style="color: var(--text-muted); font-weight: 400;">(optional)</span></label>
                <i class="fas fa-info-circle" style="top: 3rem;"></i>
                <textarea name="additional_info" placeholder="Tell us about your travel preferences..."></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <i class="fas fa-user-plus"></i>
                Create Account
            </button>
        </form>
        
        <p class="auth-footer">
            Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
        </p>
    </div>
    
    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        function checkStrength(password) {
            const fill = document.getElementById('strengthFill');
            const label = document.getElementById('strengthLabel');
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            const colors = ['#EF4444', '#F59E0B', '#F59E0B', '#22C55E', '#10B981'];
            const labels = ['Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
            const widths = ['20%', '40%', '60%', '80%', '100%'];
            
            if (password.length === 0) {
                fill.style.width = '0';
                label.textContent = '';
            } else {
                fill.style.width = widths[strength - 1];
                fill.style.background = colors[strength - 1];
                label.textContent = labels[strength - 1];
                label.style.color = colors[strength - 1];
            }
        }
    </script>
</body>
</html>
